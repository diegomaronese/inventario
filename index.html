<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Inventário Patrimonial UTFPR-AP</title>
    <meta name="description" content="Aplicativo PWA para conferência e validação do inventário de bens patrimoniais da UTFPR Campus Apucarana com leitor de código de barras e sincronização com Google Sheets." />
    <meta property="og:title" content="Inventário Patrimonial UTFPR-AP" />
    <meta property="og:description" content="Aplicativo PWA para conferência e validação do inventário de bens patrimoniais da UTFPR Campus Apucarana com leitor de código de barras e sincronização com Google Sheets." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inventário" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Capture early beforeinstallprompt event before React mounts
      window.__pwaInstallPrompt = null;
      window.__pwaInstalled = false;
      window.addEventListener('beforeinstallprompt', function(event) {
        event.preventDefault();
        window.__pwaInstallPrompt = event;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function() {
        window.__pwaInstallPrompt = null;
        window.__pwaInstalled = true;
        window.dispatchEvent(new CustomEvent('pwa-installed-success'));
      });
      // Register Service Worker early
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker ativo com escopo:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Erro ao registrar Service Worker:', err);
            });
        });
      }
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-100 antialiased selection:bg-amber-400 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
